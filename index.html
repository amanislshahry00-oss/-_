<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة الأذكار</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1 class="title">رحلة الأذكار</h1>

    <div class="sky">
        <!-- نجوم -->
        <div class="stars"></div>

        <!-- القمر الكبير في منتصف الشاشة -->
        <div class="bigMoon"></div>
    </div>

    <!-- أزرار الأقسام -->
    <div class="sections">
        <button class="sectionBtn" data-section="morning">أذكار الصباح</button>
        <button class="sectionBtn" data-section="evening">أذكار المساء</button>
        <button class="sectionBtn" data-section="sleep">أذكار النوم</button>
        <button class="sectionBtn" data-section="travel">أذكار السفر</button>
    </div>
<div id="content" class="content-area"></div>
</div>
<script src="main.js"></script>
</body>
</html>
