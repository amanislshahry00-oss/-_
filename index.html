<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة الأذكار</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <h1 class="title" id="modeTitle">رحلة الأذكار</h1>

    <div class="sky">

        <!-- نجوم -->
        <div class="twinkle"></div>

        <!-- أقمار صغيرة مرتبة بالقوس -->
        <div class="moonhover">
            <div class="moon" data-key="0"></div>
            <div class="moon" data-key="1"></div>
            <div class="moon" data-key="2"></div>
            <div class="moon" data-key="3"></div>
            <div class="moon" data-key="4"></div>
            <div class="moon" data-key="5"></div>
            <div class="moon" data-key="6"></div>
            <div class="moon" data-key="7"></div>
        </div>

        <!-- القمر الكبير -->
        <div class="halfbigMoon"></div>

    </div>

</div>

<script src="main.js"></script>
</body>
</html>
