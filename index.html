<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>أذكار مع الأقمار وأيام الأسبوع</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #1a1a40, #000022);
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 40px;
  }

  .big-moon {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 300px;
    height: 150px;
    background: linear-gradient(135deg, #a48ee0, #7e66cc);
    border-top-left-radius: 150px;
    border-top-right-radius: 150px;
    transform: translateX(-50%);
    box-shadow: 0 0 30px #7e66cc;
    z-index: 10;
  }

  .big-moon.checked::after {
    content: '✅';
    position: absolute;
    top: 10px;
    right: 30px;
    font-size: 40px;
  }

  .moons-container {
    position: absolute;
    bottom: 120px;
    left: 50%;
    width: 500px;
    height: 300px;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .small-moon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #c3b7f9, #8371d4);
    border-radius: 50%;
    position: absolute;
    box-shadow: 0 0 10px #a292d9;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
    user-select: none;
    transition: transform 0.3s ease;
  }

  .small-moon.checked::after {
    content: '✅';
    position: absolute;
    bottom: -12px;
    font-size: 14px;
  }

  .small-moon:hover {
    transform: scale(1.2);
    z-index: 20;
  }

  .moon-label {
    position: absolute;
    width: 80px;
    text-align: center;
    color: #d1c4e9;
    font-size: 14px;
    user-select: none;
  }

  /* أسماء الأيام تحت الأقمار */
  .day-label {
    position: absolute;
    width: 80px;
    text-align: center;
    color: #b8a9e4;
    font-size: 13px;
    bottom: -25px;
    user-select: none;
  }

  .azkar-box {
    margin-top: 200px;
    width: 320px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
    padding: 15px 20px;
    min-height: 140px;
    box-shadow: 0 0 15px rgba(130, 110, 230, 0.7);
    color: #f0eaff;
  }

  .azkar-text {
    font-size: 18px;
    text-align: center;
    min-height: 60px;
    line-height: 1.4;
  }

  .repeat-info {
    margin-top: 10px;
    font-size: 14px;
    color: #d4cfff;
    text-align: center;
  }

  .btn-next {
    margin-top: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    background: #7e66cc;
    border: none;
    color: white;
    font-size: 16px;
    padding: 10px 25px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .btn-next:hover {
    background: #a48ee0;
  }

  .btn-home {
    margin-top: 20px;
    background: #5a4ca6;
    border: none;
    color: white;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    display: none;
  }
  .btn-home:hover {
    background: #7e66cc;
  }
</style>
</head>
<body>

<div class="big-moon" id="bigMoon"></div>

<div class="moons-container" id="moonsContainer">
  <!-- الأقمار الصغيرة وأسماء الأيام توضع هنا -->
</div>

<div class="azkar-box" id="azkarBox" style="display:none;">
  <div class="azkar-text" id="azkarText"></div>
  <div class="repeat-info" id="repeatInfo"></div>
  <button class="btn-next" id="btnNext">التالي</button>
  <button class="btn-home" id="btnHome">العودة للصفحة الرئيسية</button>
</div>

<script>
  // بيانات الأذكار لكل قمر مع تكرار 3 مرات لكل ذكر
  const azkarData = [
    {
      name: 'أذكار المساء',
      days: ['٢', '٣', '٤', '٥', '٦', '٧', '٨'], // تمثيل أيام (يمكن تعديل النص)
      azkar: [
        "اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور",
        "أعوذ بكلمات الله التامات من شر ما خلق",
        "رضيت بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً"
      ]
    },
    {
      name: 'أذكار قيام الليل',
      days: ['٩', '١٠', '١١', '١٢', '١٣', '١٤', '١٥'],
      azkar: [
        "سبحان الله والحمد لله ولا إله إلا الله والله أكبر",
        "اللهم اجعلني من التوابين واجعلني من المتطهرين",
        "اللهم اغفر لي ولوالدي وللمؤمنين والمؤمنات"
      ]
    },
    {
      name: 'أذكار قبل النوم',
      days: ['١٦', '١٧', '١٨', '١٩', '٢٠', '٢١', '٢٢'],
      azkar: [
        "باسمك ربي وضعت جنبي وبك أرفعه",
        "اللهم قني عذابك يوم تبعث عبادك",
        "اللهم أسلمت نفسي إليك وفوضت أمري إليك"
      ]
    }
  ];

  // أسماء الأيام (مثال عربي مختصر 7 أيام)
  const weekDays = ['الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];

  const moonsContainer = document.getElementById('moonsContainer');
  const azkarBox = document.getElementById('azkarBox');
  const azkarText = document.getElementById('azkarText');
  const repeatInfo = document.getElementById('repeatInfo');
  const btnNext = document.getElementById('btnNext');
  const btnHome = document.getElementById('btnHome');
  const bigMoon = document.getElementById('bigMoon');

  const radius = 180; // نصف قطر نصف الدائرة
  const centerX = 250; // منتصف container عرض 500px / 2
  const centerY = 200; // ارتفاع نصف دائرة فوق القمر الكبير

  let currentMoonIndex = null;
  let currentAzkarIndex = 0;
  let currentRepeatCount = 0;
  const maxRepeat = 3;

  // حفظ حالة إتمام الأذكار لكل قمر
  const completedMoons = [false, false, false];

  // إنشاء الأقمار الصغيرة وتوزيعها نصف دائري
  function createMoons() {
    azkarData.forEach((moon, i) => {
      const div = document.createElement('div');
      div.classList.add('small-moon');
      div.textContent = moon.name;
      div.style.left = `${centerX + Math.cos(Math.PI * i / 2) * radius - 30}px`;
      div.style.top = `${centerY - Math.sin(Math.PI * i / 2) * radius - 30}px`;
      div.dataset.index = i;

      // إضافة اسماء الأيام تحت القمر
      const dayLabel = document.createElement('div');
      dayLabel.classList.add('day-label');
      dayLabel.style.left = `${centerX + Math.cos(Math.PI * i / 2) * radius - 40}px`;
      dayLabel.style.top = `${centerY - Math.sin(Math.PI * i / 2) * radius + 40}px`;
      dayLabel.textContent = weekDays[i]; // اسم اليوم من المصفوفة
      moonsContainer.appendChild(dayLabel);

      div.addEventListener('click', () => {
        if(currentMoonIndex !== i){
          startAzkar(i);
        }
      });

      moonsContainer.appendChild(div);
    });
  }

  // تحديث موقع الأقمار للدوران (نصف دائرة بطيء)
  let angles = [0, Math.PI / 2, Math.PI];
  const speed = 0.001;

  function animateMoons() {
    const moonDivs = moonsContainer.querySelectorAll('.small-moon');
    const dayLabels = moonsContainer.querySelectorAll('.day-label');
    moonDivs.forEach((moon, i) => {
      angles[i] += speed;

      const x = centerX + Math.cos(angles[i]) * radius - 30;
      const y = centerY - Math.sin(angles[i]) * radius - 30;

      moon.style.left = `${x}px`;
      moon.style.top = `${y}px`;

      dayLabels[i].style.left = `${x - 10}px`;
      dayLabels[i].style.top = `${y + 40}px`;

      if (completedMoons[i]) {
        moon.classList.add('checked');
      } else {
        moon.classList.remove('checked');
      }
    });

    requestAnimationFrame(animateMoons);
  }

  // بدء عرض الأذكار لقمر معين
  function startAzkar(moonIndex) {
    currentMoonIndex = moonIndex;
    currentAzkarIndex = 0;
    currentRepeatCount = 0;
    azkarBox.style.display = 'block';
    btnNext.disabled = false;
    btnHome.style.display = 'none';
    showCurrentAzkar();
  }

  // عرض الذكر الحالي مع عدد التكرار
  function showCurrentAzkar() {
    const azkarList = azkarData[currentMoonIndex].azkar;
    azkarText.textContent = azkarList[currentAzkarIndex];
    repeatInfo.textContent = `التكرار: ${currentRepeatCount + 1} / ${maxRepeat}`;
  }

  // عند الضغط على التالي (تأكيد الذكر)
  btnNext.addEventListener('click', () => {
    currentRepeatCount++;
    if (currentRepeatCount < maxRepeat) {
      showCurrentAzkar();
    } else {
      // انتهاء تكرار الذكر الحالي، ننتقل للذكر التالي
      currentRepeatCount = 0;
      currentAzkarIndex++;

      if (currentAzkarIndex >= azkarData[currentMoonIndex].azkar.length) {
        completedMoons[currentMoonIndex] = true;
        azkarBox.style.display = 'none';
        currentMoonIndex = null;
        currentAzkarIndex = 0;
        currentRepeatCount = 0;
        checkAllCompleted();
      } else {
        showCurrentAzkar();
      }
    }
  });

  // تحقق إذا تم إتمام كل الأقمار الثلاثة
  function checkAllCompleted() {
    if (completedMoons.every(c => c)) {
      bigMoon.classList.add('checked');
      btnHome.style.display = 'block';
    }
  }

  // زر العودة للصفحة الرئيسية
  btnHome.addEventListener('click', () => {
    alert('العودة إلى الصفحة الرئيسية');
    // هنا تقدر تغير التوجيه حسب التطبيق أو تضيف وظيفة أخرى
  });

  // إنشاء الأقمار وبدء الحركة
  createMoons();
  animateMoons();
</script>

</body>
</html>
