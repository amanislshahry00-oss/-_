<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>رحلة الأذكار - موقع أذكار احترافي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <header>
    <h1>رحلة الأذكار</h1>
    <button id="toggleTheme" aria-label="تبديل وضع النهار والليل">🌙</button>
  </header>

  <main>
    <section class="sky">
      <div class="stars"></div>
      <div class="bigMoon"></div>
    </section>

    <nav class="sections">
      <button class="sectionBtn active" data-section="morning">أذكار الصباح</button>
      <button class="sectionBtn" data-section="evening">أذكار المساء</button>
      <button class="sectionBtn" data-section="sleep">أذكار النوم</button>
      <button class="sectionBtn" data-section="travel">أذكار السفر</button>
    </nav>

    <article id="content" tabindex="0" aria-live="polite">
      <!-- يظهر هنا نص الأذكار -->
    </article>

  </main>

  <footer>
    <p>© 2026 رحلة الأذكار. جميع الحقوق محفوظة.</p>
  </footer>

</div>

<script src="main.js"></script>

</body>
</html>
