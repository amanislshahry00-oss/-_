<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>أذكار مع الأقمار حول القمر الكبير</title>
<style>
  /* الخلفية بنفس لون وتدرج الصورة */
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #3B2F62 0%, #231B48 100%);
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 40px;
    position: relative;
  }

  /* القمر الكبير نصف دائري */
  .big-moon {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 320px;
    height: 170px;
    background: linear-gradient(180deg, #9A86D0 0%, #674EAD 100%);
    border-top-left-radius: 160px;
    border-top-right-radius: 160px;
    box-shadow: inset 0 -10px 20px rgba(117, 92, 156, 0.7),
                0 0 40px rgba(138, 109, 205, 0.8);
    transform: translateX(-50%);
    z-index: 10;
  }

  .big-moon.checked::after {
    content: '✅';
    position: absolute;
    top: 10px;
    right: 30px;
    font-size: 40px;
  }

  /* الحاوية للأقمار الصغيرة */
  .moons-container {
    position: absolute;
    bottom: 120px;
    left: 50%;
    width: 500px;
    height: 300px;
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* الأقمار الصغيرة */
  .small-moon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #c3b7f9, #8371d4);
    border-radius: 50%;
    position: absolute;
    box-shadow: 0 0 10px #a292d9;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
    user-select: none;
    transition: transform 0.3s ease;
    pointer-events: auto;
  }

  .small-moon.checked::after {
    content: '✅';
    position: absolute;
    bottom: -12px;
    font-size: 14px;
  }

  .small-moon:hover {
    transform: scale(1.2);
    z-index: 20;
  }

  /* أسماء الأيام تحت الأقمار */
  .day-label {
    position: absolute;
    width: 80px;
    text-align: center;
    color: #b8a9e4;
    font-size: 13px;
    user-select: none;
    pointer-events: none;
  }

  /* صندوق الأذكار */
  .azkar-box {
    margin-top: 200px;
    width: 320px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
    padding: 15px 20px;
    min-height: 140px;
    box-shadow: 0 0 15px rgba(130, 110, 230, 0.7);
    color: #f0eaff;
    text-align: center;
    user-select: none;
  }

  .azkar-text {
    font-size: 18px;
    min-height: 60px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .repeat-info {
    font-size: 14px;
    color: #d4cfff;
    margin-bottom: 15px;
  }

  .btn-next, .btn-home {
    background: #7e66cc;
    border: none;
    color: white;
    font-size: 16px;
    padding: 10px 25px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin: 5px auto 0 auto;
    display: block;
  }

  .btn-next:hover, .btn-home:hover {
    background: #a48ee0;
  }

  .btn-home {
    display: none;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 20px;
  }

</style>
</head>
<body>

<div class="big-moon" id="bigMoon"></div>

<div class="moons-container" id="moonsContainer">
  <!-- الأقمار الصغيرة وأسماء الأيام توضع هنا -->
</div>

<div class="azkar-box" id="azkarBox" style="display:none;">
  <div class="azkar-text" id="azkarText"></div>
  <div class="repeat-info" id="repeatInfo"></div>
  <button class="btn-next" id="btnNext">التالي</button>
  <button class="btn-home" id="btnHome">العودة للصفحة الرئيسية</button>
</div>

<script>
  const azkarData = [
    {
      name: 'أذكار المساء',
      azkar: [
        "اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور",
        "أعوذ بكلمات الله التامات من شر ما خلق",
        "رضيت بالله رباً وبالإسلام ديناً وبمحمد صلى الله عليه وسلم نبياً"
      ]
    },
    {
      name: 'أذكار قيام الليل',
      azkar: [
        "سبحان الله والحمد لله ولا إله إلا الله والله أكبر",
        "اللهم اجعلني من التوابين واجعلني من المتطهرين",
        "اللهم اغفر لي ولوالدي وللمؤمنين والمؤمنات"
      ]
    },
    {
      name: 'أذكار قبل النوم',
      azkar: [
        "باسمك ربي وضعت جنبي وبك أرفعه",
        "اللهم قني عذابك يوم تبعث عبادك",
        "اللهم أسلمت نفسي إليك وفوضت أمري إليك"
      ]
    }
  ];

  // أسماء الأيام باللغة العربية 7 أيام (نفس الترتيب تقريباً للصورة)
  const weekDays = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];

  const moonsContainer = document.getElementById('moonsContainer');
  const azkarBox = document.getElementById('azkarBox');
  const azkarText = document.getElementById('azkarText');
  const repeatInfo = document.getElementById('repeatInfo');
  const btnNext = document.getElementById('btnNext');
  const btnHome = document.getElementById('btnHome');
  const bigMoon = document.getElementById('bigMoon');

  const centerX = 250; // مركز دائرة حركة الأقمار داخل الحاوية 500px / 2
  const centerY = 200; // ارتفاع مركز نصف الدائرة فوق القمر الكبير

  const bigMoonRadius = 160; // نصف عرض القمر الكبير
  const smallMoonRadius = 30; // نصف عرض القمر الصغير

  // نصف قطر المدار: القمر الكبير + القمر الصغير - تقليل المسافة عشان يلمسون
  const orbitRadius = bigMoonRadius + smallMoonRadius - 5;

  // زوايا توزيع الأقمار 30°, 90°, 150° بالرانديان (نصف دائرة)
  const orbitAngles = [
    (30 * Math.PI) / 180,
    (90 * Math.PI) / 180,
    (150 * Math.PI) / 180
  ];

  let currentMoonIndex = null;
  let currentAzkarIndex = 0;
  let currentRepeatCount = 0;
  const maxRepeat = 3;
  const completedMoons = [false, false, false];

  // إنشاء الأقمار وأسماء الأيام تحتهم
  function createMoons() {
    azkarData.forEach((moon, i) => {
      const div = document.createElement('div');
      div.classList.add('small-moon');
      div.textContent = moon.name;
      moonsContainer.appendChild(div);

      const dayLabel = document.createElement('div');
      dayLabel.classList.add('day-label');
      dayLabel.textContent = weekDays[i]; // اسم اليوم من المصفوفة
      moonsContainer.appendChild(dayLabel);
    });
  }

  // حركة الأقمار
  let angles = [0, 0, 0];
  const speed = 0.001;

  function animateMoons() {
    const moonDivs = moonsContainer.querySelectorAll('.small-moon');
    const dayLabels = moonsContainer.querySelectorAll('.day-label');

    moonDivs.forEach((moon, i) => {
      angles[i] += speed;
      const angle = orbitAngles[i] + angles[i] * 0.01; // حركة بطيئة جداً حول النصف دائرة

      const x = centerX + Math.cos(angle) * orbitRadius - smallMoonRadius;
      const y = centerY - Math.sin(angle) * orbitRadius - smallMoonRadius;

      moon.style.left = `${x}px`;
      moon.style.top = `${y}px`;

      dayLabels[i].style.left = `${x - 10}px`;
      dayLabels[i].style.top = `${y + 40}px`;

      if (completedMoons[i]) {
        moon.classList.add('checked');
      } else {
        moon.classList.remove('checked');
      }
    });

    requestAnimationFrame(animateMoons);
  }

  // بدء عرض الأذكار لقمر معين
  function startAzkar(moonIndex) {
    currentMoonIndex = moonIndex;
    currentAzkarIndex = 0;
    currentRepeatCount = 0;
    azkarBox.style.display = 'block';
    btnNext.disabled = false;
    btnHome.style.display = 'none';
    showCurrentAzkar();
  }

  // عرض الذكر الحالي مع التكرار
  function showCurrentAzkar() {
    const azkarList = azkarData[currentMoonIndex].azkar;
    azkarText.textContent = azkarList[currentAzkarIndex];
    repeatInfo.textContent = `التكرار: ${currentRepeatCount + 1} / ${maxRepeat}`;
  }

  // حدث الضغط على زر التالي
  btnNext.addEventListener('click', () => {
    currentRepeatCount++;
    if (currentRepeatCount < maxRepeat) {
      showCurrentAzkar();
    } else {
      currentRepeatCount = 0;
      currentAzkarIndex++;

      if (currentAzkarIndex >= azkarData[currentMoonIndex].azkar.length) {
        completedMoons[currentMoonIndex] = true;
        azkarBox.style.display = 'none';
        currentMoonIndex = null;
        currentAzkarIndex = 0;
        currentRepeatCount = 0;
        checkAllCompleted();
      } else {
        showCurrentAzkar();
      }
    }
  });

  // تحقق إذا تم إتمام جميع الأذكار في كل الأقمار
  function checkAllCompleted() {
    if (completedMoons.every(c => c)) {
      bigMoon.classList.add('checked');
      btnHome.style.display = 'block';
    }
  }

  // زر العودة للصفحة الرئيسية
  btnHome.addEventListener('click', () => {
    alert('العودة إلى الصفحة الرئيسية');
    // هنا تقدر تضيف تفعيل الرجوع للصفحة الرئيسية في تطبيقك
  });

  // تشغيل كل شيء
  createMoons();
  animateMoons();

  // إضافة حدث نقر للأقمار الصغيرة
  moonsContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('small-moon')) {
      const idx = Array.from(moonsContainer.querySelectorAll('.small-moon')).indexOf(e.target);
      if (idx !== -1) {
        startAzkar(idx);
      }
    }
  });
</script>

</body>
</html>
